name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository
        run: python scripts/validate.py

      - name: Smoke Git state runtime
        run: python runtime/git_state.py --help

      - name: Verify clean bundle install and discovery
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/agent-handrails-skills"
          links="$RUNNER_TEMP/agent-handrails-codex"
          python scripts/sync_skills.py --apply --target "$target" --codex-link-root "$links"
          python scripts/sync_skills.py --check --target "$target" --codex-link-root "$links"
          current="$(readlink -f "$target/.agent-handrails/current")"
          test -z "$(find "$current" -name '__pycache__' -o -name '*.pyc' -o -name '*.pyo')"

      - name: Confirm tracked source stayed clean
        run: test -z "$(git status --porcelain --untracked-files=no)"
