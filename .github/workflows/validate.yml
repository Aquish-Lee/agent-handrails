name: Advisory validation

# Hosted CI is intentionally manual/advisory while repository billing is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked top-level development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run local quality gate
        run: python scripts/quality.py --skip-official-skills

      - name: Run official Agent Skills validator
        if: matrix.python-version != '3.10'
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            agentskills validate "$skill"
          done

      - name: Verify clean Raw install, uninstall, and reinstall
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/agent-handrails-skills"
          links="$RUNNER_TEMP/agent-handrails-codex"
          python scripts/sync_skills.py --apply --target "$target" --codex-link-root "$links"
          python scripts/sync_skills.py --check --target "$target" --codex-link-root "$links"
          python scripts/sync_skills.py --uninstall --target "$target"
          test -d "$target/.agent-handrails/bundles"
          python scripts/sync_skills.py --apply --target "$target" --codex-link-root "$links"
          python scripts/sync_skills.py --uninstall --purge --target "$target"
          test ! -e "$target/.agent-handrails"

      - name: Confirm tracked source stayed clean
        run: test -z "$(git status --porcelain --untracked-files=no)"
